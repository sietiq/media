<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الوسائط السحابي - Google Drive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-500/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide">معرض الوسائط السحابي</h1>
                    <p class="text-[11px] text-slate-400">متصل بـ Google Drive</p>
                </div>
            </div>
            
            <!-- زر الرفع المصغر (سهم داخل سحابة) -->
            <button onclick="toggleUploadModal(true)" title="رفع ملف جديد" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center transition hover:scale-105">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h10a4 4 0 004-4M12 3v12m0-12l4 4m-4-4l-4 4"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

        <!-- Filters & Loading State -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
            <div class="flex items-center gap-3">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <span>مكتبة الوسائط</span>
                    <span id="total-count" class="text-xs bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/30">0 ملف</span>
                </h2>
                <span id="loading-indicator" class="text-xs text-yellow-400 animate-pulse">جاري جلب الملفات من الدرايف...</span>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 w-full sm:w-auto">
                <button onclick="filterMedia('all')" id="filter-all" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition flex-1 sm:flex-none">الكل</button>
                <button onclick="filterMedia('image')" id="filter-image" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex-1 sm:flex-none">📸 الصور</button>
                <button onclick="filterMedia('video')" id="filter-video" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex-1 sm:flex-none">🎥 الفيديوهات</button>
            </div>
        </div>

        <!-- Media Grid -->
        <div id="media-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-20 bg-slate-900/30 rounded-3xl border border-slate-800/60 hidden">
            <p class="text-slate-400 font-medium">لا توجد ملفات في مجلد الدرايف حالياً</p>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl relative space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold">رفع ملفات جديدة إلى Google Drive</h3>
                <button onclick="toggleUploadModal(false)" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-6 text-center cursor-pointer bg-slate-950 relative">
                <input type="file" id="file-input" multiple accept="image/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                <div class="flex flex-col items-center gap-2">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h10a4 4 0 004-4M12 3v12m0-12l4 4m-4-4l-4 4"></path></svg>
                    <p class="text-xs font-bold text-slate-200">اختر الصور أو الفيديوهات للرفع</p>
                </div>
            </div>

            <div id="upload-queue" class="space-y-2 max-h-32 overflow-y-auto hidden"></div>

            <!-- Progress Bar Section -->
            <div id="progress-container" class="space-y-1.5 hidden">
                <div class="flex justify-between text-xs text-slate-400">
                    <span id="progress-text">جاري الرفع...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden border border-slate-800">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300 w-0"></div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2 border-t border-slate-800">
                <button onclick="toggleUploadModal(false)" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">إلغاء</button>
                <button onclick="startUpload()" id="upload-btn" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/20">بدء الرفع للسحاب</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div id="lightbox-content" class="relative max-w-4xl max-h-[90vh]" onclick="event.stopPropagation()"></div>
    </div>

    <!-- Script Logic -->
    <script>
        // رابط السكربت الجديد المدمج
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvy77IOXZyJepvOTRmR-z4pEiIYLqhcCEFXFAeCCUGaRZgN4_wQvhlBtOKe7VVgdJP/exec";

        let mediaLibrary = [];
        let currentFilter = 'all';
        let selectedFiles = [];

        window.addEventListener('DOMContentLoaded', () => fetchDriveFiles());

        async function fetchDriveFiles() {
            const indicator = document.getElementById('loading-indicator');
            try {
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();
                if (result.status === 'success') {
                    mediaLibrary = result.files.map(f => ({
                        ...f,
                        type: f.mimeType && f.mimeType.startsWith('video') ? 'video' : 'image',
                        likes: parseInt(localStorage.getItem('like_' + f.id) || '0'),
                        liked: localStorage.getItem('liked_' + f.id) === 'true',
                        comments: JSON.parse(localStorage.getItem('comm_' + f.id) || '[]')
                    }));
                    renderMedia();
                }
            } catch (err) {
                console.error("خطأ في جلب الملفات:", err);
            } finally {
                indicator.style.display = 'none';
            }
        }

        function toggleUploadModal(show) {
            document.getElementById('upload-modal').classList.toggle('hidden', !show);
            if (!show) { 
                selectedFiles = []; 
                document.getElementById('upload-queue').classList.add('hidden');
                document.getElementById('progress-container').classList.add('hidden');
                document.getElementById('progress-bar').style.width = '0%';
            }
        }

        document.getElementById('file-input').addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            const queue = document.getElementById('upload-queue');
            if (selectedFiles.length > 0) {
                queue.classList.remove('hidden');
                queue.innerHTML = selectedFiles.map(f => `<p class="text-[11px] text-slate-300 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">${f.name} (${(f.size/(1024*1024)).toFixed(1)} MB)</p>`).join('');
            }
        });

        async function startUpload() {
            if (selectedFiles.length === 0) return;
            
            const btn = document.getElementById('upload-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressText = document.getElementById('progress-text');

            btn.disabled = true;
            progressContainer.classList.remove('hidden');
            
            let totalFiles = selectedFiles.length;
            let completed = 0;

            for (let i = 0; i < totalFiles; i++) {
                let file = selectedFiles[i];
                progressText.innerText = `جاري رفع: ${file.name}`;
                
                try {
                    const base64 = await toBase64(file);
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ filename: file.name, mimeType: file.type, bytes: base64 })
                    });
                } catch (e) { 
                    console.error(e); 
                }

                completed++;
                let percent = Math.round((completed / totalFiles) * 100);
                progressBar.style.width = percent + '%';
                progressPercent.innerText = percent + '%';
            }

            progressText.innerText = "تم الرفع بنجاح!";
            setTimeout(() => {
                toggleUploadModal(false);
                btn.disabled = false;
                fetchDriveFiles();
            }, 800);
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result.split(',')[1]);
                reader.onerror = err => reject(err);
                reader.readAsDataURL(file);
            });
        }

        function renderMedia() {
            const grid = document.getElementById('media-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';
            
            const filtered = mediaLibrary.filter(item => currentFilter === 'all' || item.type === currentFilter);
            document.getElementById('total-count').innerText = `${mediaLibrary.length} ملف`;

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
                return;
            } else {
                empty.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between";
                
                let preview = item.type === 'image'
                    ? `<img src="${item.url}" class="w-full h-48 object-cover cursor-pointer hover:scale-105 transition" onclick="openLightbox('image', '${item.url}')">`
                    : `<div class="relative w-full h-48 bg-slate-950 flex items-center justify-center cursor-pointer hover:scale-105 transition" onclick="openLightbox('video', '${item.url}')">
                         <video src="${item.url}" class="w-full h-48 object-cover opacity-85"></video>
                         <div class="absolute inset-0 bg-black/40 flex items-center justify-center"><div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white">▶</div></div>
                       </div>`;

                let commentsHTML = item.comments.map(c => `<p class="text-xs text-slate-300 bg-slate-950 px-2 py-1 rounded border border-slate-800/60">${c}</p>`).join('');

                card.innerHTML = `
                    <div>
                        <div class="relative overflow-hidden">${preview}
                            <span class="absolute top-3 right-3 bg-slate-950/80 text-xs px-2.5 py-1 rounded-lg border border-slate-800 text-slate-300">${item.type === 'image' ? '📸 صورة' : '🎥 فيديو'}</span>
                        </div>
                        <div class="p-4 space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-sm text-slate-200 truncate max-w-[170px]" title="${item.name}">${item.name}</h3>
                                <a href="${item.driveUrl}" target="_blank" class="text-xs text-blue-400 hover:underline">رابط الدرايف</a>
                            </div>
                            
                            <!-- Like -->
                            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                                <button onclick="toggleLike('${item.id}')" class="flex items-center gap-1 text-xs font-semibold ${item.liked ? 'text-red-500' : 'text-slate-400 hover:text-red-400'}">
                                    <span>${item.liked ? '❤️' : '🤍'}</span> <span>${item.likes} إعجاب</span>
                                </button>
                                <span class="text-xs text-slate-500">${item.date}</span>
                            </div>

                            <!-- Comments -->
                            <div class="space-y-2 pt-2 border-t border-slate-800/60">
                                <div class="max-h-20 overflow-y-auto space-y-1 pr-1">${commentsHTML || '<p class="text-xs text-slate-600 italic">لا توجد تعليقات</p>'}</div>
                                <div class="flex gap-2">
                                    <input type="text" id="comm-input-${item.id}" placeholder="اكتب تعليقاً..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                    <button onclick="addComment('${item.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs">نشر</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function filterMedia(type) {
            currentFilter = type;
            ['all', 'image', 'video'].forEach(t => {
                document.getElementById(`filter-${t}`).className = t === type 
                    ? "px-4 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition flex-1 sm:flex-none shadow-md"
                    : "px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex-1 sm:flex-none";
            });
            renderMedia();
        }

        function toggleLike(id) {
            const item = mediaLibrary.find(i => i.id === id);
            if (item) {
                item.liked = !item.liked;
                item.likes += item.liked ? 1 : -1;
                localStorage.setItem('like_' + id, item.likes);
                localStorage.setItem('liked_' + id, item.liked);
                renderMedia();
            }
        }

        function addComment(id) {
            const input = document.getElementById(`comm-input-${id}`);
            const text = input.value.trim();
            if (!text) return;
            const item = mediaLibrary.find(i => i.id === id);
            if (item) {
                item.comments.push(text);
                localStorage.setItem('comm_' + id, JSON.stringify(item.comments));
                renderMedia();
            }
        }

        function openLightbox(type, url) {
            const lb = document.getElementById('lightbox');
            const content = document.getElementById('lightbox-content');
            content.innerHTML = type === 'image' ? `<img src="${url}" class="max-h-[85vh] rounded-2xl shadow-2xl">` : `<video src="${url}" controls autoplay class="max-h-[85vh] rounded-2xl shadow-2xl"></video>`;
            lb.classList.remove('hidden');
        }
        function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); }
    </script>
</body>
</html>
