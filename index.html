<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التصفح السحابية - Google Drive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">معرض الوسائط السحابي</h1>
                    <p class="text-xs text-slate-400">تصفح، تفاعل، وارفع ملفاتك إلى Google Drive</p>
                </div>
            </div>
            
            <button onclick="toggleUploadModal(true)" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow-lg shadow-blue-600/30 flex items-center gap-2 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                رفع ملف جديد
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

        <!-- Filters Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <span>مكتبة الوسائط</span>
                    <span id="total-count" class="text-xs bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/30">0 ملف</span>
                </h2>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 w-full sm:w-auto">
                <button onclick="filterMedia('all')" id="filter-all" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition flex-1 sm:flex-none">الكل</button>
                <button onclick="filterMedia('image')" id="filter-image" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex-1 sm:flex-none">📸 الصور</button>
                <button onclick="filterMedia('video')" id="filter-video" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex-1 sm:flex-none">🎥 الفيديوهات</button>
            </div>
        </div>

        <!-- Media Grid -->
        <div id="media-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Items Inserted Here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-20 bg-slate-900/30 rounded-3xl border border-slate-800/60">
            <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <p class="text-slate-400 font-medium">لا توجد ملفات مرفوعة حالياً</p>
            <p class="text-xs text-slate-500 mt-1">اضغط على زر "رفع ملف جديد" لإضافة صور أو فيديوهات</p>
        </div>
    </main>

    <!-- Upload Modal Popup -->
    <div id="upload-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl relative space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 class="text-lg font-bold">رفع صور أو فيديوهات جديدة</h3>
                <button onclick="toggleUploadModal(false)" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="border-2 border-dashed border-slate-700 hover:border-blue-500 transition-all rounded-2xl p-6 text-center cursor-pointer bg-slate-950 relative group">
                <input type="file" id="file-input" multiple accept="image/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                <div class="flex flex-col items-center justify-center space-y-2">
                    <div class="w-12 h-12 bg-blue-600/10 rounded-full flex items-center justify-center text-blue-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <p class="text-sm font-bold text-slate-200">اختر الملفات أو اسحبها هنا</p>
                </div>
            </div>

            <div id="upload-queue" class="space-y-2 max-h-40 overflow-y-auto hidden"></div>

            <div class="flex justify-end gap-3 pt-2 border-t border-slate-800">
                <button onclick="toggleUploadModal(false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm">إلغاء</button>
                <button onclick="startUpload()" id="upload-btn" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-blue-600/30">بدء الرفع للسحاب</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeLightbox()">
        <div class="relative max-w-4xl max-h-[90vh] w-full flex items-center justify-center" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-12 left-0 text-white bg-slate-800/80 hover:bg-slate-700 p-2 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="lightbox-content" class="w-full flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-6 bg-slate-900 border border-slate-700 text-slate-200 px-5 py-3 rounded-xl shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <span>✅</span>
        <span id="toast-msg" class="text-sm font-medium">رسالة إشعار</span>
    </div>

    <!-- Script Logic -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby13wzCEl1ZPW4XUzS8zO_wlGh8pvNBKbnZv9dGkk05T7kbCi2Gkhjc9v2sWDFcyE8j/exec";

        let selectedFiles = [];
        let mediaLibrary = JSON.parse(localStorage.getItem('mediaLibrary') || '[]');
        let currentFilter = 'all';

        const fileInput = document.getElementById('file-input');
        const uploadQueue = document.getElementById('upload-queue');
        const mediaGrid = document.getElementById('media-grid');
        const emptyState = document.getElementById('empty-state');
        const totalCount = document.getElementById('total-count');

        window.addEventListener('DOMContentLoaded', () => renderMedia());

        function toggleUploadModal(show) {
            const modal = document.getElementById('upload-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                selectedFiles = [];
                uploadQueue.classList.add('hidden');
                uploadQueue.innerHTML = '';
            }
        }

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            if (selectedFiles.length > 0) {
                uploadQueue.classList.remove('hidden');
                uploadQueue.innerHTML = selectedFiles.map((f, i) => `
                    <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                        <span class="truncate text-slate-300">${f.name}</span>
                        <span class="text-slate-500">${(f.size/(1024*1024)).toFixed(1)} MB</span>
                    </div>
                `).join('');
            }
        });

        async function startUpload() {
            if (selectedFiles.length === 0) return;

            const btn = document.getElementById('upload-btn');
            btn.disabled = true;
            btn.innerText = "جاري الرفع إلى الدرايف...";

            let successCount = 0;

            for (let file of selectedFiles) {
                try {
                    const base64Data = await readFileAsBase64(file);
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ filename: file.name, mimeType: file.type, bytes: base64Data })
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        mediaLibrary.unshift({
                            id: 'file_' + Date.now() + Math.random().toString(36).substr(2, 5),
                            name: file.name,
                            type: file.type.startsWith('video') ? 'video' : 'image',
                            url: URL.createObjectURL(file),
                            driveUrl: result.fileUrl,
                            size: (file.size / (1024*1024)).toFixed(2) + ' MB',
                            date: new Date().toLocaleDateString('ar-EG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                            likes: 0,
                            liked: false,
                            comments: []
                        });
                        successCount++;
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            localStorage.setItem('mediaLibrary', JSON.stringify(mediaLibrary));
            renderMedia();
            toggleUploadModal(false);
            btn.disabled = false;
            btn.innerText = "بدء الرفع للسحاب";
            showToast(`تم رفع ${successCount} ملف إلى Google Drive بنجاح!`);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result.split(',')[1]);
                reader.onerror = err => reject(err);
                reader.readAsDataURL(file);
            });
        }

        function renderMedia() {
            mediaGrid.innerHTML = '';
            const filtered = mediaLibrary.filter(item => currentFilter === 'all' || item.type === currentFilter);
            totalCount.innerText = `${mediaLibrary.length} ملف`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between";
                
                let previewHTML = item.type === 'image' 
                    ? `<img src="${item.url}" class="w-full h-48 object-cover cursor-pointer hover:scale-105 transition duration-300" onclick="openLightbox('image', '${item.url}')">`
                    : `<div class="relative w-full h-48 bg-slate-950 flex items-center justify-center cursor-pointer hover:scale-105 transition duration-300" onclick="openLightbox('video', '${item.url}')">
                         <video src="${item.url}" class="w-full h-48 object-cover opacity-80"></video>
                         <div class="absolute inset-0 bg-black/40 flex items-center justify-center"><div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white">▶</div></div>
                       </div>`;

                let commentsHTML = item.comments.map(c => `<p class="text-xs text-slate-300 bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800/60">${c}</p>`).join('');

                card.innerHTML = `
                    <div>
                        <div class="relative overflow-hidden">
                            ${previewHTML}
                            <span class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur text-xs font-semibold px-2.5 py-1 rounded-lg border border-slate-800 text-slate-300">
                                ${item.type === 'image' ? '📸 صورة' : '🎥 فيديو'}
                            </span>
                        </div>
                        <div class="p-4 space-y-3">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-sm text-slate-200 truncate max-w-[180px]" title="${item.name}">${item.name}</h3>
                                ${item.driveUrl ? `<a href="${item.driveUrl}" target="_blank" class="text-xs text-blue-400 hover:underline">رابط الدرايف</a>` : ''}
                            </div>
                            
                            <!-- Like Button -->
                            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                                <button onclick="toggleLike('${item.id}')" class="flex items-center gap-1.5 text-xs font-semibold ${item.liked ? 'text-red-500' : 'text-slate-400 hover:text-red-400'} transition">
                                    <span>${item.liked ? '❤️' : '🤍'}</span>
                                    <span>${item.likes} إعجاب</span>
                                </button>
                                <span class="text-xs text-slate-500">${item.date}</span>
                            </div>

                            <!-- Comments Section -->
                            <div class="space-y-2 pt-2 border-t border-slate-800/60">
                                <div class="max-h-24 overflow-y-auto space-y-1 pr-1" id="comments-${item.id}">
                                    ${commentsHTML || '<p class="text-xs text-slate-600 italic">لا توجد تعليقات بعد</p>'}
                                </div>
                                <div class="flex gap-2">
                                    <input type="text" id="comment-input-${item.id}" placeholder="اكتب تعليقاً..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                    <button onclick="addComment('${item.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">نشر</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                mediaGrid.appendChild(card);
            });
        }

        function filterMedia(type) {
            currentFilter = type;
            ['all', 'image', 'video'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if (t === type) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition flex-1 sm:flex-none shadow-md";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex-1 sm:flex-none";
                }
            });
            renderMedia();
        }

        function toggleLike(id) {
            const item = mediaLibrary.find(i => i.id === id);
            if (item) {
                if (item.liked) {
                    item.liked = false;
                    item.likes--;
                } else {
                    item.liked = true;
                    item.likes++;
                }
                localStorage.setItem('mediaLibrary', JSON.stringify(mediaLibrary));
                renderMedia();
            }
        }

        function addComment(id) {
            const input = document.getElementById(`comment-input-${id}`);
            const text = input.value.trim();
            if (!text) return;

            const item = mediaLibrary.find(i => i.id === id);
            if (item) {
                item.comments.push(text);
                localStorage.setItem('mediaLibrary', JSON.stringify(mediaLibrary));
                renderMedia();
                input.value = '';
            }
        }

        function openLightbox(type, url) {
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightbox-content');
            content.innerHTML = type === 'image' 
                ? `<img src="${url}" class="max-h-[85vh] max-w-full rounded-2xl shadow-2xl object-contain">`
                : `<video src="${url}" controls autoplay class="max-h-[85vh] max-w-full rounded-2xl shadow-2xl"></video>`;
            lightbox.classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.getElementById('lightbox-content').innerHTML = '';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
